<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador do Cardápio (€) - Burger Studio</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen pb-12">

  <!-- BARRA SUPERIOR -->
  <nav class="bg-gray-900 border-b border-gray-800 text-white p-4 sticky top-0 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🛠️</span>
        <div>
          <h1 class="text-xl font-extrabold text-orange-500 uppercase tracking-wider">Burger Studio</h1>
          <p class="text-xs text-gray-400">Edição e Exclusão do Cardápio (€ Euro)</p>
        </div>
      </div>
      <a href="admin.html" class="bg-gray-800 hover:bg-gray-700 text-xs font-bold px-4 py-2 rounded-xl border border-gray-700 transition">
        ⬅️ Voltar ao Admin
      </a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 mt-8">

    <!-- SEÇÃO 1: GERENCIAR CATEGORIAS -->
    <section class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-lg mb-8">
      <h2 class="text-lg font-extrabold text-orange-400 mb-4 flex items-center gap-2">
        <span>📂</span> Categorias Cadastradas
      </h2>
      <div id="lista-categorias" class="flex flex-wrap gap-3">
        <p class="text-xs text-gray-500">Carregando categorias...</p>
      </div>
    </section>

    <!-- SEÇÃO 2: GERENCIAR E EDITAR PRODUTOS -->
    <section class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-lg">
      <h2 class="text-lg font-extrabold text-white mb-4 flex items-center gap-2">
        <span>🍔</span> Produtos e Imagens (€)
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-950 text-gray-400 uppercase text-xs font-bold border-b border-gray-800">
            <tr>
              <th class="p-3">Foto</th>
              <th class="p-3">Produto</th>
              <th class="p-3">Categoria</th>
              <th class="p-3">Preço (€)</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos" class="divide-y divide-gray-800"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- MODAL PARA EDITAR IMAGEM E DADOS DO PRODUTO -->
  <div id="modal-editar" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-orange-500/30">
      <h3 class="text-xl font-bold text-white mb-4">🖼️ Editar Produto / Alterar Foto</h3>
      
      <form id="form-editar" onsubmit="salvarEdicaoProduto(event)" class="space-y-4">
        <input type="hidden" id="edit-id">

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nome do Produto</label>
          <input type="text" id="edit-nome" required class="w-full bg-gray-950 border border-gray-800 text-white p-3 rounded-xl text-sm outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Preço (€ EUR)</label>
          <input type="number" step="0.01" id="edit-preco" required class="w-full bg-gray-950 border border-gray-800 text-white p-3 rounded-xl text-sm outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase mb-1">URL da Imagem / Foto</label>
          <input type="url" id="edit-img" placeholder="https://..." class="w-full bg-gray-950 border border-gray-800 text-white p-3 rounded-xl text-sm outline-none focus:border-orange-500">
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="fecharModalEditar()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl text-xs">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs shadow-lg shadow-orange-500/20">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURAÇÃO SUPABASE
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://shiexpkmmiwsaspdqbok.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWV4cGttbWl3c2FzcGRxYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjAxMDksImV4cCI6MjEwMjIzNjEwOX0.auQyqT0xh7fsNwKEmN5wG7VTdXgeg6EUUpocC9xtDAQ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cacheProdutos = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await carregarCategorias();
      await carregarProdutos();
    });

    // -------------------------------------------------------------
    // CATEGORIAS: LISTAR E EXCLUIR
    // -------------------------------------------------------------
    async function carregarCategorias() {
      const { data } = await _supabase.from('categorias').select('*').order('nome');
      const container = document.getElementById('lista-categorias');

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500">Nenhuma categoria encontrada.</p>';
        return;
      }

      container.innerHTML = data.map(c => `
        <div class="flex items-center gap-2 bg-gray-950 border border-gray-800 px-3 py-1.5 rounded-xl">
          <span class="text-xs font-bold text-white">${c.nome}</span>
          <button onclick="excluirCategoria('${c.id}', '${c.nome}')" class="text-red-400 hover:text-red-300 text-xs font-extrabold ml-1">✕</button>
        </div>
      `).join('');
    }

    async function excluirCategoria(id, nome) {
      if (!confirm(`Tem certeza que deseja excluir a categoria "${nome}"?`)) return;

      const { error } = await _supabase.from('categorias').delete().eq('id', id);

      if (error) {
        alert("Erro ao excluir categoria. Verifique se existem produtos associados a ela.");
      } else {
        await carregarCategorias();
      }
    }

    // -------------------------------------------------------------
    // PRODUTOS: LISTAR, EDITAR FOTO E EXCLUIR
    // -------------------------------------------------------------
    async function carregarProdutos() {
      const { data } = await _supabase.from('produtos').select('*, categorias(nome)').order('created_at', { ascending: false });
      cacheProdutos = data || [];

      const tbody = document.getElementById('tabela-produtos');
      tbody.innerHTML = cacheProdutos.map(p => `
        <tr class="hover:bg-gray-950/50 transition">
          <td class="p-3">
            <img src="${p.imagem_url || 'https://via.placeholder.com/80'}" class="w-12 h-12 object-cover rounded-lg border border-gray-800" alt="Foto">
          </td>
          <td class="p-3 font-bold text-white">${p.nome}</td>
          <td class="p-3 text-xs text-gray-400">${p.categorias ? p.categorias.nome : 'Sem Categoria'}</td>
          <td class="p-3 font-semibold text-orange-400">€ ${Number(p.preco).toFixed(2)}</td>
          <td class="p-3 text-right space-x-2">
            <button onclick="abrirModalEditar('${p.id}')" class="text-xs bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg border border-blue-500/30 transition">
              🖼️ Editar Foto / Dados
            </button>
            <button onclick="excluirProduto('${p.id}', '${p.nome}')" class="text-xs bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded-lg border border-red-500/30 transition">
              🗑️ Excluir
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function excluirProduto(id, nome) {
      if (!confirm(`Tem certeza que deseja excluir o produto "${nome}"?`)) return;

      const { error } = await _supabase.from('produtos').delete().eq('id', id);

      if (error) {
        alert("Erro ao excluir produto!");
      } else {
        await carregarProdutos();
      }
    }

    // -------------------------------------------------------------
    // MODAL DE EDIÇÃO DE IMAGEM / DADOS
    // -------------------------------------------------------------
    function abrirModalEditar(id) {
      const produto = cacheProdutos.find(p => p.id === id);
      if (!produto) return;

      document.getElementById('edit-id').value = produto.id;
      document.getElementById('edit-nome').value = produto.nome;
      document.getElementById('edit-preco').value = produto.preco;
      document.getElementById('edit-img').value = produto.imagem_url || '';

      document.getElementById('modal-editar').classList.remove('hidden');
    }

    function fecharModalEditar() {
      document.getElementById('modal-editar').classList.add('hidden');
    }

    async function salvarEdicaoProduto(e) {
      e.preventDefault();

      const id = document.getElementById('edit-id').value;
      const nome = document.getElementById('edit-nome').value;
      const preco = parseFloat(document.getElementById('edit-preco').value);
      const imagem_url = document.getElementById('edit-img').value;

      const { error } = await _supabase.from('produtos').update({
        nome,
        preco,
        imagem_url: imagem_url || null
      }).eq('id', id);

      if (error) {
        alert("Erro ao salvar alterações do produto!");
      } else {
        fecharModalEditar();
        await carregarProdutos();
      }
    }
  </script>
</body>
</html>
