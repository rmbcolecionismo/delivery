<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Studio - Cardápio Digital</title>
  
  <!-- Supabase JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burger: {
              orange: '#f97316',
              red: '#dc2626',
              dark: '#090d16',
              panel: '#111827'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen pb-28 selection:bg-orange-500 selection:text-white">

  <!-- CABEÇALHO DA LOJA -->
  <header class="bg-burger-panel border-b border-gray-800 sticky top-0 z-40 shadow-xl">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🍔</span>
        <div>
          <h1 class="text-xl font-black text-white tracking-wider">BURGER <span class="text-orange-500">STUDIO</span></h1>
          <div class="flex items-center gap-2">
            <span id="badge-status-loja" class="inline-flex items-center gap-1.5 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-green-500/10 text-green-400 border border-green-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Aberto
            </span>
          </div>
        </div>
      </div>

      <!-- BOTÃO CARRINHO RÁPIDO NO HEADER -->
      <button onclick="abrirModalCarrinho()" class="bg-orange-500/10 hover:bg-orange-500 hover:text-white text-orange-400 border border-orange-500/30 px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2">
        <span>🛒</span>
        <span id="btn-header-qtd" class="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-md font-black">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-4">

    <!-- FILTRO DE CATEGORIAS PROFISSIONAL -->
    <div class="sticky top-[73px] z-30 bg-gray-950/80 backdrop-blur-md py-3 mb-6 -mx-4 px-4 border-b border-gray-800/50">
      <div id="container-categorias" class="flex items-center gap-2.5 overflow-x-auto scrollbar-none py-1">
        <button onclick="filtrarCategoria('todas', event)" class="btn-cat active-cat bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs whitespace-nowrap transition-all duration-200 shadow-md shadow-orange-500/20 hover:scale-105 active:scale-95 flex items-center gap-2 border border-orange-400/30">
          <span>🔥</span> Todas
        </button>
        <!-- Categorias dinâmicas serão injetadas aqui -->
      </div>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <p class="col-span-full text-center text-gray-500 py-12">Carregando cardápio...</p>
    </div>

  </main>

  <!-- BARRA FIXA INFERIOR DO CARRINHO -->
  <div id="barra-carrinho" class="fixed bottom-0 left-0 right-0 bg-burger-panel/95 backdrop-blur-md border-t border-gray-800 p-4 z-30 transition-transform duration-300 translate-y-full shadow-2xl">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <div>
        <span class="text-xs text-gray-400 font-medium block">Total do Pedido:</span>
        <span id="carrinho-total" class="text-2xl font-black text-orange-500">€ 0,00</span>
      </div>
      <button onclick="abrirModalCarrinho()" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-2xl font-black text-sm transition shadow-lg shadow-orange-500/20 flex items-center gap-2">
        <span>Ver Carrinho</span>
        <span id="carrinho-qtd" class="bg-white/20 text-white px-2 py-0.5 rounded-lg text-xs">0</span>
      </button>
    </div>
  </div>

  <!-- MODAL DO CARRINHO / CHECKOUT -->
  <div id="modal-carrinho" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-end opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-burger-panel w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto border-l border-gray-800">
      
      <div>
        <!-- CABEÇALHO DO MODAL -->
        <div class="flex justify-between items-center pb-4 border-b border-gray-800 mb-4">
          <h2 class="text-lg font-black text-white flex items-center gap-2">
            <span>🛒</span> Meu Carrinho
          </h2>
          <button onclick="fecharModalCarrinho()" class="text-gray-400 hover:text-white p-2 text-xl">✕</button>
        </div>

        <!-- LISTA DOS ITENS NO CARRINHO -->
        <div id="lista-carrinho" class="space-y-3 mb-6">
          <p class="text-center text-gray-500 py-8 text-xs font-semibold">O carrinho está vazio.</p>
        </div>

        <!-- FORMULÁRIO DO CLIENTE -->
        <form id="form-checkout" onsubmit="finalizarPedido(event)" class="border-t border-gray-800 pt-4 space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Seu Nome *</label>
            <input type="text" id="cli-nome" placeholder="Ex: João Silva" required class="w-full bg-gray-950 border border-gray-800 text-white px-3 py-2.5 rounded-xl text-sm outline-none focus:border-orange-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Telefone / WhatsApp *</label>
            <input type="tel" id="cli-tel" placeholder="Ex: +351 912 345 678" required class="w-full bg-gray-950 border border-gray-800 text-white px-3 py-2.5 rounded-xl text-sm outline-none focus:border-orange-500">
          </div>

          <!-- SELEÇÃO: ENTREGAR OU LEVANTAR -->
          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Tipo de Pedido *</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" id="btn-tipo-entrega" onclick="selecionarTipoEntrega('Entrega')" class="py-2.5 px-3 rounded-xl text-xs font-bold border border-orange-500 bg-orange-500/10 text-orange-400 flex items-center justify-center gap-1.5 transition">
                🛵 Entrega
              </button>
              <button type="button" id="btn-tipo-retirada" onclick="selecionarTipoEntrega('Retirada')" class="py-2.5 px-3 rounded-xl text-xs font-bold border border-gray-800 bg-gray-950 text-gray-400 flex items-center justify-center gap-1.5 transition">
                🏪 Levantar na Loja
              </button>
            </div>
          </div>

          <!-- CAMPO ENDEREÇO (EXIBIDO SE FOR ENTREGA) -->
          <div id="box-endereco">
            <label class="block text-xs font-bold text-gray-400 mb-1">Endereço de Entrega *</label>
            <input type="text" id="cli-endereco" placeholder="Rua, Número, Andar / Código Postal" class="w-full bg-gray-950 border border-gray-800 text-white px-3 py-2.5 rounded-xl text-sm outline-none focus:border-orange-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-400 mb-1">Forma de Pagamento *</label>
            <select id="cli-pagamento" required class="w-full bg-gray-950 border border-gray-800 text-white px-3 py-2.5 rounded-xl text-sm outline-none focus:border-orange-500">
              <option value="Dinheiro">💶 Dinheiro</option>
              <option value="Cartão de Crédito/Débito">💳 Cartão de Crédito / Débito</option>
              <option value="MB Way / Transferência">📱 MB Way / App</option>
            </select>
          </div>

          <!-- RESUMO DE VALORES -->
          <div class="space-y-1.5 py-3 border-t border-b border-gray-800/80 my-3">
            <div class="flex justify-between items-center text-xs text-gray-400">
              <span>Subtotal dos produtos:</span>
              <span id="modal-subtotal" class="font-bold text-gray-200">€ 0,00</span>
            </div>
            <div id="row-taxa-entrega" class="flex justify-between items-center text-xs text-orange-400">
              <span>Taxa de Entrega:</span>
              <span id="modal-taxa" class="font-bold">€ 2,00</span>
            </div>
            <div class="flex justify-between items-center pt-1 border-t border-gray-800/40">
              <span class="text-sm font-bold text-gray-300">Total a Pagar:</span>
              <span id="modal-carrinho-total" class="text-2xl font-black text-orange-500">€ 0,00</span>
            </div>
          </div>

          <button type="submit" id="btn-finalizar" class="w-full bg-green-600 hover:bg-green-500 text-white font-extrabold py-3.5 rounded-xl transition text-sm shadow-lg shadow-green-600/20">
            ✅ Confirmar e Enviar Pedido
          </button>
        </form>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURAÇÃO SUPABASE
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://shiexpkmmiwsaspdqbok.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWV4cGttbWl3c2FzcGRxYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjAxMDksImV4cCI6MjEwMjIzNjEwOX0.auQyqT0xh7fsNwKEmN5wG7VTdXgeg6EUUpocC9xtDAQ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let carrinho = [];
    let produtosCache = [];
    let tipoEntregaAtual = 'Entrega'; 
    let taxaEntregaValor = 2.00;

    document.addEventListener('DOMContentLoaded', async () => {
      await checarStatusLoja();
      await carregarTaxaEntrega();
      await carregarCategorias();
      await carregarProdutos();
      selecionarTipoEntrega('Entrega');
    });

    // -------------------------------------------------------------
    // CARREGAR CONFIGURAÇÕES
    // -------------------------------------------------------------
    async function checarStatusLoja() {
      try {
        const { data } = await _supabase.from('configuracoes').select('loja_aberta').eq('id', 1).maybeSingle();
        const badge = document.getElementById('badge-status-loja');
        if (data && data.loja_aberta === false) {
          badge.className = "inline-flex items-center gap-1.5 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
          badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> Fechado`;
        }
      } catch (e) {
        console.error("Erro status loja:", e);
      }
    }

    async function carregarTaxaEntrega() {
      try {
        const { data } = await _supabase.from('configuracoes').select('taxa_entrega').eq('id', 1).maybeSingle();
        if (data && data.taxa_entrega !== undefined && data.taxa_entrega !== null) {
          taxaEntregaValor = Number(data.taxa_entrega);
        }
      } catch (e) {
        console.error("Erro taxa entrega:", e);
      }
    }

    // -------------------------------------------------------------
    // CARREGAR CATEGORIAS E PRODUTOS
    // -------------------------------------------------------------
    async function carregarCategorias() {
      try {
        const { data } = await _supabase.from('categorias').select('*').order('nome');
        const container = document.getElementById('container-categorias');
        if (!data) return;

        data.forEach(cat => {
          const btn = document.createElement('button');
          btn.onclick = (e) => filtrarCategoria(cat.nome, e);
          btn.className = "btn-cat bg-gray-900/80 hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 font-bold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition-all duration-200 hover:scale-105 active:scale-95";
          btn.innerText = cat.nome;
          container.appendChild(btn);
        });
      } catch (e) {
        console.error("Erro ao carregar categorias:", e);
      }
    }

    async function carregarProdutos() {
      try {
        const { data, error } = await _supabase.from('produtos').select('*').order('nome');
        if (error) throw error;
        produtosCache = data || [];
        renderizarProdutos(produtosCache);
      } catch (e) {
        console.error("Erro ao carregar produtos:", e);
        document.getElementById('grid-produtos').innerHTML = `<p class="col-span-full text-center text-red-500 py-12">Erro ao carregar os produtos. Verifique as credenciais do Supabase.</p>`;
      }
    }

    function renderizarProdutos(lista) {
      const grid = document.getElementById('grid-produtos');
      if (!lista || lista.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-12">Nenhum produto disponível.</p>`;
        return;
      }

      grid.innerHTML = lista.map(p => `
        <div class="bg-burger-panel border border-gray-800/80 rounded-3xl p-4 flex flex-col justify-between shadow-lg hover:border-gray-700 transition">
          <div>
            <!-- IMAGEM COM OBJECT-CONTAIN PARA NÃO CORTAR -->
            <div class="h-48 w-full bg-gray-950 rounded-2xl overflow-hidden mb-3 relative border border-gray-800/50 p-2 flex items-center justify-center">
              <img src="${p.imagem_url || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80'}" class="w-full h-full object-contain drop-shadow-md">
              <span class="absolute top-2 right-2 bg-gray-950/90 backdrop-blur-md border border-gray-800 text-orange-400 font-extrabold text-[10px] px-2.5 py-1 rounded-lg">
                ${p.categoria || 'Geral'}
              </span>
            </div>
            <h3 class="font-extrabold text-white text-base mb-1">${p.nome}</h3>
            <p class="text-gray-400 text-xs line-clamp-2 mb-4 font-medium">${p.descricao || 'Sem descrição informada.'}</p>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-gray-800/60">
            <span class="text-lg font-black text-orange-500">€ ${Number(p.preco).toFixed(2)}</span>
            <button onclick="adicionarAoCarrinho('${p.id}')" class="bg-orange-500 hover:bg-orange-600 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 shadow-md shadow-orange-500/20 hover:scale-105 active:scale-95">
              <span>+</span> Adicionar
            </button>
          </div>
        </div>
      `).join('');
    }

    function filtrarCategoria(nomeCat, evt) {
      // Atualizar visual do botão clicado
      if (evt && evt.currentTarget) {
        document.querySelectorAll('.btn-cat').forEach(btn => {
          btn.className = "btn-cat bg-gray-900/80 hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 font-bold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap transition-all duration-200 hover:scale-105 active:scale-95";
        });
        
        evt.currentTarget.className = "btn-cat active-cat bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs whitespace-nowrap transition-all duration-200 shadow-md shadow-orange-500/20 hover:scale-105 active:scale-95 flex items-center gap-2 border border-orange-400/30";
      }

      // Filtrar produtos
      if (nomeCat === 'todas') {
        renderizarProdutos(produtosCache);
      } else {
        const filtrados = produtosCache.filter(p => p.categoria === nomeCat);
        renderizarProdutos(filtrados);
      }
    }

    // -------------------------------------------------------------
    // LÓGICA DO CARRINHO E SELEÇÃO DE TIPO DE ENTREGA
    // -------------------------------------------------------------
    function adicionarAoCarrinho(id) {
      const prod = produtosCache.find(p => p.id === id);
      if (!prod) return;

      const idx = carrinho.findIndex(i => i.id === id);
      if (idx !== -1) {
        carrinho[idx].qtd += 1;
      } else {
        carrinho.push({ id: prod.id, nome: prod.nome, preco: Number(prod.preco), qtd: 1 });
      }

      atualizarCarrinhoUI();
    }

    function alterarQtdItem(id, delta) {
      const idx = carrinho.findIndex(i => i.id === id);
      if (idx !== -1) {
        carrinho[idx].qtd += delta;
        if (carrinho[idx].qtd <= 0) carrinho.splice(idx, 1);
      }
      atualizarCarrinhoUI();
    }

    function selecionarTipoEntrega(tipo) {
      tipoEntregaAtual = tipo;
      const btnEntrega = document.getElementById('btn-tipo-entrega');
      const btnRetirada = document.getElementById('btn-tipo-retirada');
      const boxEndereco = document.getElementById('box-endereco');
      const inputEndereco = document.getElementById('cli-endereco');
      const rowTaxa = document.getElementById('row-taxa-entrega');

      if (tipo === 'Entrega') {
        btnEntrega.className = "py-2.5 px-3 rounded-xl text-xs font-bold border border-orange-500 bg-orange-500/10 text-orange-400 flex items-center justify-center gap-1.5 transition";
        btnRetirada.className = "py-2.5 px-3 rounded-xl text-xs font-bold border border-gray-800 bg-gray-950 text-gray-400 flex items-center justify-center gap-1.5 transition";
        
        boxEndereco.classList.remove('hidden');
        inputEndereco.required = true;
        rowTaxa.classList.remove('hidden');
      } else {
        btnRetirada.className = "py-2.5 px-3 rounded-xl text-xs font-bold border border-orange-500 bg-orange-500/10 text-orange-400 flex items-center justify-center gap-1.5 transition";
        btnEntrega.className = "py-2.5 px-3 rounded-xl text-xs font-bold border border-gray-800 bg-gray-950 text-gray-400 flex items-center justify-center gap-1.5 transition";
        
        boxEndereco.classList.add('hidden');
        inputEndereco.required = false;
        inputEndereco.value = '';
        rowTaxa.classList.add('hidden');
      }

      atualizarCarrinhoUI();
    }

    function atualizarCarrinhoUI() {
      const subtotal = carrinho.reduce((sum, item) => sum + (item.preco * item.qtd), 0);
      const taxaAplicada = (tipoEntregaAtual === 'Entrega') ? taxaEntregaValor : 0;
      const totalGeral = subtotal + taxaAplicada;
      const qtdTotal = carrinho.reduce((sum, item) => sum + item.qtd, 0);

      document.getElementById('carrinho-total').innerText = `€ ${totalGeral.toFixed(2)}`;
      document.getElementById('modal-subtotal').innerText = `€ ${subtotal.toFixed(2)}`;
      document.getElementById('modal-taxa').innerText = `€ ${taxaEntregaValor.toFixed(2)}`;
      document.getElementById('modal-carrinho-total').innerText = `€ ${totalGeral.toFixed(2)}`;
      document.getElementById('carrinho-qtd').innerText = qtdTotal;
      document.getElementById('btn-header-qtd').innerText = qtdTotal;

      const barra = document.getElementById('barra-carrinho');
      if (qtdTotal > 0) {
        barra.classList.remove('translate-y-full');
      } else {
        barra.classList.add('translate-y-full');
        fecharModalCarrinho();
      }

      renderizarItensModal();
    }

    function renderizarItensModal() {
      const container = document.getElementById('lista-carrinho');
      if (carrinho.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-8 text-xs font-semibold">O carrinho está vazio.</p>`;
        return;
      }

      container.innerHTML = carrinho.map(item => `
        <div class="flex items-center justify-between bg-gray-950 p-3 rounded-2xl border border-gray-800">
          <div>
            <h4 class="font-bold text-white text-xs">${item.nome}</h4>
            <span class="text-orange-500 font-extrabold text-xs">€ ${(item.preco * item.qtd).toFixed(2)}</span>
          </div>
          <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl p-1">
            <button type="button" onclick="alterarQtdItem('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-white font-bold text-sm">-</button>
            <span class="text-xs font-bold text-white w-4 text-center">${item.qtd}</span>
            <button type="button" onclick="alterarQtdItem('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center text-gray-400 hover:text-white font-bold text-sm">+</button>
          </div>
        </div>
      `).join('');
    }

    function abrirModalCarrinho() {
      const modal = document.getElementById('modal-carrinho');
      modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function fecharModalCarrinho() {
      const modal = document.getElementById('modal-carrinho');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    // -------------------------------------------------------------
    // FINALIZAR PEDIDO (ENVIO AO SUPABASE)
    // -------------------------------------------------------------
    async function finalizarPedido(e) {
      e.preventDefault();

      if (carrinho.length === 0) return;

      const btn = document.getElementById('btn-finalizar');
      btn.disabled = true;
      btn.innerText = "Processando Pedido...";

      const clienteNome = document.getElementById('cli-nome').value;
      const clienteTel = document.getElementById('cli-tel').value;
      const clienteEndereco = tipoEntregaAtual === 'Entrega' ? document.getElementById('cli-endereco').value : 'Levantar na Loja';
      const formaPagamento = document.getElementById('cli-pagamento').value;
      
      const subtotal = carrinho.reduce((sum, item) => sum + (item.preco * item.qtd), 0);
      const taxaAplicada = tipoEntregaAtual === 'Entrega' ? taxaEntregaValor : 0;
      const totalGeral = subtotal + taxaAplicada;
      const numeroPedido = Math.floor(1000 + Math.random() * 9000);

      const novoPedido = {
        numero_pedido: Number(numeroPedido),
        cliente_nome: clienteNome,
        cliente_telefone: clienteTel,
        tipo_entrega: tipoEntregaAtual,
        endereco_entrega: clienteEndereco,
        forma_pagamento: formaPagamento,
        itens: carrinho,
        taxa_entrega: Number(taxaAplicada),
        total: Number(totalGeral),
        status: 'Pendente'
      };

      const { error } = await _supabase.from('pedidos').insert([novoPedido]);

      if (error) {
        alert("Erro ao enviar pedido: " + error.message);
        console.error(error);
        btn.disabled = false;
        btn.innerText = "✅ Confirmar e Enviar Pedido";
        return;
      }

      carrinho = [];
      atualizarCarrinhoUI();
      fecharModalCarrinho();
      btn.disabled = false;
      btn.innerText = "✅ Confirmar e Enviar Pedido";

      alert(`Pedido #${numeroPedido} enviado com sucesso! (${tipoEntregaAtual === 'Entrega' ? '🛵 Entrega' : '🏪 Levantar na Loja'})`);
    }
  </script>
</body>
</html>
