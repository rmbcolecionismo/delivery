<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - Delivery</title>

  <!-- CSS Framework (Tailwind CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Client SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Painel Administrativo</h2>
      
      <!-- Feedback / Alertas -->
      <div id="login-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded"></div>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
          <input 
            type="email" 
            id="email" 
            required 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
            placeholder="admin@seudominio.com"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
          <input 
            type="password" 
            id="password" 
            required 
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
            placeholder="••••••••"
          />
        </div>

        <button 
          type="submit" 
          id="btn-login"
          class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-md shadow focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== PAINEL DE ADMINISTRAÇÃO ==================== -->
  <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
    <!-- Navbar Topo -->
    <header class="bg-indigo-600 text-white shadow">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Gestão de Pedidos & Delivery</h1>
        <div class="flex items-center space-x-4">
          <span id="user-display" class="text-sm opacity-90"></span>
          <button 
            id="btn-logout" 
            class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded text-sm transition"
          >
            Sair
          </button>
        </div>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold text-gray-800">Pedidos Recebidos</h2>
        <button 
          onclick="loadOrders()" 
          class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-md"
        >
          Atualizar Lista
        </button>
      </div>

      <!-- Tabela/Lista de Pedidos -->
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
            </tr>
          </thead>
          <tbody id="orders-list" class="bg-white divide-y divide-gray-200">
            <!-- Os pedidos do Supabase serão renderizados aqui via JS -->
            <tr>
              <td colspan="5" class="px-6 py-4 text-center text-gray-500 text-sm">
                Carregando dados...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Script Principal de Configuração & Lógica -->
  <script>
    // 1. CONFIGURAÇÃO DO SUPABASE
    // Substitua pelas suas chaves do console Supabase (Project Settings > API)
    const SUPABASE_URL = 'https://shiexpkmmiwsaspdqbok.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWV4cGttbWl3c2FzcGRxYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjAxMDksImV4cCI6MjEwMjIzNjEwOX0.auQyqT0xh7fsNwKEmN5wG7VTdXgeg6EUUpocC9xtDAQ';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Elementos DOM
    const loginScreen = document.getElementById('login-screen');
    const adminDashboard = document.getElementById('admin-dashboard');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const btnLogout = document.getElementById('btn-logout');
    const userDisplay = document.getElementById('user-display');

    // 2. VERIFICAÇÃO DE SESSÃO AO CARREGAR A PÁGINA
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (session) {
        showDashboard(session.user);
      } else {
        showLogin();
      }
    });

    // Escuta alterações na autenticação (login, logout, etc)
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        showDashboard(session.user);
      } else if (event === 'SIGNED_OUT') {
        showLogin();
      }
    });

    // 3. AÇÃO DE LOGIN
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        loginError.innerText = error.message || 'Erro ao efetuar login.';
        loginError.classList.remove('hidden');
      }
    });

    // 4. AÇÃO DE LOGOUT
    btnLogout.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    // 5. NAVEGAÇÃO DE INTERFACE
    function showDashboard(user) {
      loginScreen.classList.add('hidden');
      adminDashboard.classList.remove('hidden');
      userDisplay.innerText = user.email;
      loadOrders(); // Carrega os dados da aplicação
    }

    function showLogin() {
      adminDashboard.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }

    // 6. BUSCA DE DADOS (Exemplo de consulta à tabela de 'pedidos')
    async function loadOrders() {
      const tbody = document.getElementById('orders-list');
      
      /*
        Exemplo de consulta na tabela "orders" (ajuste o nome da tabela no Supabase conforme sua estrutura):
        
        const { data: orders, error } = await supabase
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });
      */

      // Exemplo de renderização dinâmica básica
      tbody.innerHTML = `
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">#1001</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">João Silva</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">
              Pendente
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">R$ 45,00</td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button class="text-indigo-600 hover:text-indigo-900">Ver detalhes</button>
          </td>
        </tr>
      `;
    }
  </script>
</body>
</html>
