<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Studio - Painel de Pedidos / Cozinha</title>
  
  <!-- Supabase JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burger: {
              orange: '#f97316',
              red: '#dc2626',
              dark: '#090d16',
              panel: '#111827'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen pb-12 selection:bg-orange-500 selection:text-white">

  <!-- CABEÇALHO PADRÃO ADMIN/PAINEL -->
  <header class="bg-burger-panel border-b border-gray-800 text-white sticky top-0 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap justify-between items-center gap-4">
      
      <!-- Identificação -->
      <div class="flex items-center gap-3">
        <span class="text-3xl">👨‍🍳</span>
        <div>
          <h1 class="text-xl font-black text-orange-500 uppercase tracking-wider">Painel da Cozinha</h1>
          <p class="text-xs text-gray-400 font-medium">Gestão de Pedidos em Tempo Real</p>
        </div>
      </div>

      <!-- Ações do Topo -->
      <div class="flex items-center gap-3">
        <button onclick="carregarPedidos()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-gray-700">
          <span>🔄</span> Atualizar
        </button>
        <a href="admin.html" class="bg-orange-500/10 hover:bg-orange-500 hover:text-white text-orange-400 border border-orange-500/30 px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
          <span>⚙️</span> Abrir Admin
        </a>
      </div>

    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 mt-8">

    <!-- BARRA DE FILTROS RÁPIDOS -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-burger-panel p-4 rounded-2xl border border-gray-800 shadow-lg">
      <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
        <span class="text-xs font-extrabold text-gray-400 uppercase tracking-wider mr-2">Filtrar:</span>
        <button onclick="filtrarStatus('todos')" id="flt-todos" class="btn-flt bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-extrabold transition">
          Todos (<span id="cnt-todos">0</span>)
        </button>
        <button onclick="filtrarStatus('Pendente')" id="flt-Pendente" class="btn-flt bg-gray-900 text-amber-400 hover:bg-gray-800 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold transition">
          🟡 Pendentes (<span id="cnt-Pendente">0</span>)
        </button>
        <button onclick="filtrarStatus('Em Preparo')" id="flt-Em Preparo" class="btn-flt bg-gray-900 text-blue-400 hover:bg-gray-800 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold transition">
          🔵 Em Preparo (<span id="cnt-Em Preparo">0</span>)
        </button>
        <button onclick="filtrarStatus('Concluido')" id="flt-Concluido" class="btn-flt bg-gray-900 text-green-400 hover:bg-gray-800 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold transition">
          🟢 Concluídos (<span id="cnt-Concluido">0</span>)
        </button>
      </div>

      <p class="text-xs text-gray-400 font-medium hidden sm:block">
        ⏱️ Atualização automática ativa
      </p>
    </div>

    <!-- GRID DE CARDS DOS PEDIDOS -->
    <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="col-span-full text-center text-gray-500 py-16">Carregando pedidos...</p>
    </div>

  </main>

  <script>
    // -------------------------------------------------------------
    // CONFIGURAÇÃO SUPABASE
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://shiexpkmmiwsaspdqbok.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWV4cGttbWl3c2FzcGRxYm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjAxMDksImV4cCI6MjEwMjIzNjEwOX0.auQyqT0xh7fsNwKEmN5wG7VTdXgeg6EUUpocC9xtDAQ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cachePedidos = [];
    let statusFiltroAtual = 'todos';

    document.addEventListener('DOMContentLoaded', () => {
      carregarPedidos();
      // Atualiza os pedidos a cada 10 segundos automaticamente
      setInterval(carregarPedidos, 10000);
    });

    // -------------------------------------------------------------
    // CARREGAR PEDIDOS DO SUPABASE
    // -------------------------------------------------------------
    async function carregarPedidos() {
      const { data, error } = await _supabase
        .from('pedidos')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Erro ao carregar pedidos:", error);
        return;
      }

      cachePedidos = data || [];
      atualizarContadores();
      renderizarPedidos();
    }

    // -------------------------------------------------------------
    // ATUALIZAR CONTADORES DOS FILTROS
    // -------------------------------------------------------------
    function atualizarContadores() {
      document.getElementById('cnt-todos').innerText = cachePedidos.length;
      document.getElementById('cnt-Pendente').innerText = cachePedidos.filter(p => p.status === 'Pendente').length;
      document.getElementById('cnt-Em Preparo').innerText = cachePedidos.filter(p => p.status === 'Em Preparo').length;
      document.getElementById('cnt-Concluido').innerText = cachePedidos.filter(p => p.status === 'Concluido' || p.status === 'Concluído').length;
    }

    // -------------------------------------------------------------
    // RENDERIZAR CARDS DOS PEDIDOS
    // -------------------------------------------------------------
    function renderizarPedidos() {
      const grid = document.getElementById('grid-pedidos');
      if (!grid) return;

      let lista = cachePedidos;
      if (statusFiltroAtual !== 'todos') {
        if (statusFiltroAtual === 'Concluido') {
          lista = cachePedidos.filter(p => p.status === 'Concluido' || p.status === 'Concluído');
        } else {
          lista = cachePedidos.filter(p => p.status === statusFiltroAtual);
        }
      }

      if (lista.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-burger-panel rounded-3xl border border-gray-800">
            <span class="text-4xl block mb-2">📋</span>
            <p class="text-gray-400 font-bold text-sm">Nenhum pedido encontrado nesta categoria.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = lista.map(p => {
        const dataHora = p.created_at ? new Date(p.created_at).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : '--:--';
        const itens = Array.isArray(p.itens) ? p.itens : [];

        return `
          <div class="bg-burger-panel border border-gray-800 rounded-3xl p-5 flex flex-col justify-between shadow-xl relative overflow-hidden transition hover:border-gray-700">
            
            <div>
              <!-- CABEÇALHO DO CARD -->
              <div class="flex justify-between items-start pb-4 border-b border-gray-800/80 mb-4">
                <div>
                  <span class="text-xs font-black text-orange-500 uppercase tracking-widest block">Pedido</span>
                  <h3 class="text-2xl font-black text-white">#${p.numero_pedido || p.id}</h3>
                </div>
                <div class="text-right">
                  <span class="text-xs text-gray-400 font-bold block mb-1">🕒 ${dataHora}</span>
                  ${obterBadgeStatus(p.status)}
                </div>
              </div>

              <!-- DADOS DO CLIENTE -->
              <div class="bg-gray-950/60 p-3.5 rounded-2xl border border-gray-800/60 mb-4 space-y-1">
                <p class="text-sm font-extrabold text-white flex items-center gap-2">
                  <span>👤</span> ${p.cliente_nome || 'Cliente não identificado'}
                </p>
                <p class="text-xs text-gray-400 flex items-center gap-2">
                  <span>📞</span> ${p.cliente_telefone || 'Sem contato'}
                </p>
                <p class="text-xs text-gray-400 flex items-center gap-2">
                  <span>💳</span> ${p.forma_pagamento || 'A combinar'}
                </p>
              </div>

              <!-- LISTA DOS ITENS DO PEDIDO -->
              <div class="mb-4">
                <p class="text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-2">Itens Solicitados:</p>
                <ul class="space-y-2 max-h-48 overflow-y-auto pr-1">
                  ${itens.map(i => `
                    <li class="flex justify-between items-center text-xs bg-gray-900/80 p-2.5 rounded-xl border border-gray-800/50">
                      <span class="font-bold text-white"><b class="text-orange-500">${i.qtd}x</b> ${i.nome}</span>
                      <span class="text-gray-400 font-semibold">€ ${(Number(i.preco) * Number(i.qtd)).toFixed(2)}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>

            <!-- RODAPÉ DO CARD COM TOTAL E AÇÃO -->
            <div class="border-t border-gray-800/80 pt-4 mt-auto">
              <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-extrabold text-gray-400 uppercase">Total:</span>
                <span class="text-xl font-black text-orange-500">€ ${Number(p.total || 0).toFixed(2)}</span>
              </div>

              <!-- SELETOR DE MUDANÇA DE STATUS -->
              <div class="flex items-center gap-2">
                <select onchange="atualizarStatusPedido('${p.id}', this.value)" class="w-full bg-gray-950 border border-gray-800 text-white text-xs font-bold py-2.5 px-3 rounded-xl outline-none focus:border-orange-500">
                  <option value="Pendente" ${p.status === 'Pendente' ? 'selected' : ''}>🟡 Pendente</option>
                  <option value="Em Preparo" ${p.status === 'Em Preparo' ? 'selected' : ''}>🔵 Em Preparo</option>
                  <option value="Saiu p/ Entrega" ${p.status === 'Saiu p/ Entrega' ? 'selected' : ''}>💜 Saiu p/ Entrega</option>
                  <option value="Concluido" ${p.status === 'Concluido' || p.status === 'Concluído' ? 'selected' : ''}>🟢 Concluído</option>
                  <option value="Cancelado" ${p.status === 'Cancelado' ? 'selected' : ''}>🔴 Cancelado</option>
                </select>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // -------------------------------------------------------------
    // BADGES VISUAIS DE STATUS
    // -------------------------------------------------------------
    function obterBadgeStatus(status) {
      switch(status) {
        case 'Pendente':
          return `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">Pendente</span>`;
        case 'Em Preparo':
          return `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">Em Preparo</span>`;
        case 'Saiu p/ Entrega':
          return `<span class="bg-purple-500/10 text-purple-400 border border-purple-500/30 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">Entrega</span>`;
        case 'Concluido':
        case 'Concluído':
          return `<span class="bg-green-500/10 text-green-400 border border-green-500/30 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">Concluído</span>`;
        case 'Cancelado':
          return `<span class="bg-red-500/10 text-red-400 border border-red-500/30 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">Cancelado</span>`;
        default:
          return `<span class="bg-gray-800 text-gray-400 px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase">${status || 'Pendente'}</span>`;
      }
    }

    // -------------------------------------------------------------
    // ATUALIZAR STATUS NO SUPABASE
    // -------------------------------------------------------------
    async function atualizarStatusPedido(pedidoId, novoStatus) {
      const { error } = await _supabase
        .from('pedidos')
        .update({ status: novoStatus })
        .eq('id', pedidoId);

      if (error) {
        alert("Erro ao atualizar status do pedido.");
        console.error(error);
        return;
      }

      // Atualiza o cache local e re-renderiza
      const idx = cachePedidos.findIndex(p => p.id === pedidoId);
      if (idx !== -1) cachePedidos[idx].status = novoStatus;
      
      atualizarContadores();
      renderizarPedidos();
    }

    // -------------------------------------------------------------
    // FILTRAR CATEGORIAS
    // -------------------------------------------------------------
    function filtrarStatus(status) {
      statusFiltroAtual = status;

      document.querySelectorAll('.btn-flt').forEach(b => {
        b.className = "btn-flt bg-gray-900 text-gray-400 hover:text-white hover:bg-gray-800 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold transition";
      });

      const btnAtivo = document.getElementById(`flt-${status}`);
      if (btnAtivo) {
        btnAtivo.className = "btn-flt bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-extrabold transition shadow-lg shadow-orange-500/20";
      }

      renderizarPedidos();
    }
  </script>
</body>
</html>
